<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raccourcis AoE IV</title>
  <style>
    :root {
      --fond: #f6f4ef; --carte: #ffffff; --texte: #1f1d1a; --discret: #625c52; --trait: #cdc6b8; --touche: #e8e3d9; --grille: #dde5d6;
      --accent: #8a5a00; --geste: #1f62c4; --sur-geste: #ffffff; --conflit: #b0172f; --sur-conflit: #ffffff; --erreur: #a12a1a;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #1b1a18; --carte: #24221f; --texte: #ece8e0; --discret: #a59e91; --trait: #45413b; --touche: #2e2b27; --grille: #26301f;
        --accent: #e0a940; --geste: #6aa6ff; --sur-geste: #10131a; --conflit: #e04a62; --sur-conflit: #14060a; --erreur: #ff8a75; }
    }
    body { background: var(--fond); color: var(--texte); font: 17px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 46rem; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.3rem; margin: 0; }
    h2 { font-size: 1rem; margin: 0; }
    p { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
    .ic.grande { width: 3rem; height: 3rem; stroke-width: 1.6; }
    kbd { font: 700 .95rem system-ui, sans-serif; display: inline-block; min-width: 1.8em; text-align: center; padding: 1px 6px;
      background: var(--touche); border: 1px solid var(--trait); border-bottom-width: 3px; border-radius: 6px; white-space: nowrap; }
    .lien { color: var(--discret); font-size: .85rem; }

    .tete { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .tete label { margin-left: auto; }
    .vues { display: flex; border: 1px solid var(--trait); border-radius: 999px; overflow: hidden; }
    .vues button { background: none; border: 0; padding: .3rem .8rem; display: flex; gap: .4rem; align-items: center; }
    .vues button[aria-pressed="true"] { background: var(--texte); color: var(--fond); }

    .scene { background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 1rem; display: grid; gap: .8rem; }
    .haut { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; color: var(--discret); }
    #etiquette { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; }
    .acte { display: flex; align-items: center; gap: .9rem; }
    #action { font-size: 1.4rem; font-weight: 700; line-height: 1.15; }
    #question { color: var(--discret); }
    #sequence { display: flex; gap: .5rem; list-style: none; padding: 0; margin: 0; font-size: 1.4rem; font-weight: 700; }
    #sequence .fait { opacity: .4; text-decoration: line-through; }
    #suggestion { color: var(--accent); font-size: 2rem; font-weight: 700; }
    #suggestions { display: grid; gap: .5rem; justify-items: start; }
    .autres { display: flex; flex-wrap: wrap; gap: .5rem; }
    .suggestion { display: inline-grid; gap: 3px; justify-items: start; text-align: left; background: var(--carte); border: 2px solid var(--trait); border-radius: 10px; padding: .35rem .6rem; }
    .suggestion:hover { background: var(--touche); }
    .suggestion.grande { padding: .7rem 1.1rem; border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .suggestion.grande kbd { font-size: 1.3rem; }
    .touches { display: inline-flex; align-items: center; gap: 4px; }
    .etoiles { color: var(--accent); margin-left: .4rem; }
    .logique { font-size: .8rem; color: var(--discret); display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .logique kbd { font-size: .75rem; padding: 0 4px; }
    .grande .logique { font-size: 1rem; color: var(--texte); }
    .grande .logique kbd { font-size: .85rem; }
    .criteres { display: flex; flex-wrap: wrap; gap: .3rem .8rem; font-size: .8rem; }
    .criteres span:not(.manque) { color: var(--accent); }
    .criteres .sans-objet { opacity: .6; }
    .criteres .manque { color: var(--discret); text-decoration: line-through; }
    .outils { display: flex; gap: .5rem; flex-wrap: wrap; }
    .outils button { padding: .35rem 1rem; }
    #message { min-height: 1.5em; }
    #message.erreur { color: var(--erreur); }

    .mains { margin: 1rem 0; }
    #clavier { --u: 2.9rem; display: grid; gap: 4px; overflow-x: auto; padding: 6px; }
    .rangee { display: flex; gap: 4px; }
    .touche { position: relative; flex: none; width: calc(var(--u) * var(--largeur) - 4px); height: calc(var(--u) * .95); background: var(--touche);
      border: 1px solid var(--trait); border-bottom-width: 3px; border-radius: 6px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1px; font-weight: 700; font-size: .9rem; line-height: 1.1; }
    .touche.longue { font-size: .7rem; }
    .touche.grille { background: var(--grille); }
    .touche.reservee { background: transparent; border-style: dashed; color: var(--discret); font-weight: 500; }
    .touche.repos { box-shadow: 0 0 0 2px var(--fond), 0 0 0 4px var(--texte); }
    .touche.conflit { background: var(--conflit); border-color: var(--conflit); border-style: solid; color: var(--sur-conflit); }
    .touche.conflit .icones { color: inherit; }
    .icones { display: flex; gap: 1px; color: var(--discret); }
    .icones .ic { width: .85rem; height: .85rem; }
    .doigt { position: absolute; bottom: 1px; right: 2px; font: 700 .55rem system-ui, sans-serif; font-style: normal; background: var(--texte); color: var(--fond); border-radius: 999px; padding: 0 3px; }
    #manette { position: relative; width: 100%; max-width: 34rem; aspect-ratio: 2.2 / 1; }
    .souris { position: absolute; left: 77%; top: 10%; width: 18%; height: 82%; border: 2px solid var(--trait); border-radius: 46% 46% 50% 50%; }
    .place { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; }
    .bouton { width: 4rem; aspect-ratio: 1; border-radius: 50%; background: var(--touche); border: 2px solid var(--trait); border-bottom-width: 5px;
      display: grid; place-content: center; justify-items: center; line-height: 1.05; }
    .bouton small { font-size: .6rem; color: var(--discret); }
    .mouvement { font-size: .8rem; font-weight: 700; color: var(--geste); white-space: nowrap; }
    :is(.touche, .bouton):is(.tape, .tape2, .tenue) { background: var(--geste); border-color: var(--geste); border-style: solid; color: var(--sur-geste); }
    :is(.tape, .tape2, .tenue) :is(.icones, small) { color: inherit; }
    .tenue { transform: translateY(2px); border-bottom-width: 1px; }
    .tape { animation: tape 1.4s ease-in-out 3; }
    .tape2 { animation: tape2 1.4s ease-in-out 3; }
    @keyframes tape { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(3px); } }
    @keyframes tape2 { 0%, 50%, 100% { transform: none; } 12%, 32% { transform: translateY(3px); } 22% { transform: none; } }
    @media (prefers-reduced-motion: reduce) { .tape, .tape2 { animation: none; } }
    .entouree { outline: 2px dashed var(--texte); outline-offset: 4px; }

    .recap ul { list-style: none; padding: 0; margin: 0; }
    .recap li > * { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .5rem; width: 100%;
      padding: .3rem 0; border: 0; border-bottom: 1px solid var(--trait); background: none; text-align: left; }
    .recap button:hover { background: var(--touche); }
    .valeur { display: inline-flex; align-items: center; gap: 3px; }
    .etat { color: var(--discret); }
    #score { color: var(--accent); margin-left: .5rem; }

    body[data-vue="manette"] #clavier, body:not([data-vue="manette"]) #manette,
    body:not([data-etape="posture"]) .posture, body:not([data-etape="action"]) .partie, body[data-etape="fin"] #suivant,
    body[data-etape="posture"] .jeu, body[data-etape="fin"] .jeu, body[data-etape="posture"] .recap,
    body:not([data-etape="grille"]):not([data-etape="enchainement"]) .entrainement { display: none; }
  </style>
</head>

  <header class="tete">
    <h1>Raccourcis AoE IV</h1>
    <label><input type="checkbox" id="entrainement"> Entraînement</label>
    <div class="vues" role="group" aria-label="Vue">
      <button type="button" id="vue-main" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-hand"/></svg>Main posée</button>
      <button type="button" id="vue-manette" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-pad"/></svg>Manette</button>
    </div>
  </header>
  <section class="scene">
    <p class="haut"><span id="titre"></span><span class="jeu" id="etiquette"></span></p>
    <div class="acte">
      <span id="icone"></span>
      <div><p class="jeu" id="action"></p><p id="question"></p></div>
    </div>
    <ol class="entrainement" id="sequence"></ol>
    <div class="partie" id="suggestions"></div>
    <p class="posture">Suggestion : <span id="suggestion"></span></p>
    <p class="outils">
      <button id="suivant" type="button">Suivant</button>
      <button class="partie" id="plus-tard" type="button">Plus tard</button>
      <button class="partie" id="ne-pas-utiliser" type="button">Ne pas utiliser</button>
    </p>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
  <section class="mains">
    <div id="clavier"></div>
    <div id="manette"></div>
  </section>
  <ul id="posture"></ul>
  <section class="recap">
    <h2>Tes raccourcis <span id="score"></span></h2>
    <h3>Partie optimisée</h3>
    <ul id="optimisee"></ul>
    <h3>Extras</h3>
    <ul id="extras"></ul>
  </section>
  <script type="module" src="src/main.js"></script>

</html>
