<title>Raccourcis AoE IV pas à pas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout : une colonne ; la scène (icône, action, suggestions) au-dessus du clavier dessiné ou de la manette, tes raccourcis en bas */
  :root {
    --bg: #eef0f3;
    --surface: #ffffff;
    --ink: #1b2130;
    --muted: #5a6376;
    --line: #c9cfd9;
    --key: #e3e7ee;
    --grid: #dde5d6;
    --accent: #b0172f;
    --accent-ink: #ffffff;
    --warn: #8a4b00;
    --ok: #2f6b2f;
    --gold: #b07a00;
    --sk: #1f62c4;
    --sc: #7442c8;
    --s-ink: #ffffff;
    --display: "Alegreya SC", Georgia, serif;
    --body: "Alegreya Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #13161c; --surface: #1b1f27; --ink: #e6e9ef; --muted: #9aa3b4;
      --line: #363d4a; --key: #262b35; --grid: #24301f; --accent: #e04a62; --accent-ink: #14060a; --warn: #f0b060;
      --ok: #7fc47f; --gold: #f0c24a; --sk: #6aa6ff; --sc: #b393ff; --s-ink: #10131a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #13161c; --surface: #1b1f27; --ink: #e6e9ef; --muted: #9aa3b4;
    --line: #363d4a; --key: #262b35; --grid: #24301f; --accent: #e04a62; --accent-ink: #14060a; --warn: #f0b060;
    --ok: #7fc47f; --gold: #f0c24a; --sk: #6aa6ff; --sc: #b393ff; --s-ink: #10131a;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--body); padding-block: 20px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wrap { max-width: 46rem; margin: 0 auto; display: grid; gap: 16px; }
  h1, h2, h3, .action { font-family: var(--display); font-weight: 700; text-wrap: balance; margin: 0; }
  h1 { font-size: 1.5rem; line-height: 1.1; }
  h2 { font-size: 1.2rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h3 { font-size: 1rem; display: flex; align-items: center; gap: 6px; }
  p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; flex: none; }
  .ic.big { width: 3rem; height: 3rem; stroke-width: 1.6; }
  .ic.star { stroke: var(--gold); stroke-width: 1.6; }
  .ic.star.on { fill: var(--gold); }
  kbd { font: 700 .95rem var(--body); display: inline-block; min-width: 1.9em; text-align: center; padding: 1px 7px;
    background: var(--key); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; white-space: nowrap; }
  .plus, .x2 { font-weight: 700; color: var(--muted); }
  .x2 { font-size: .8rem; }

  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 0 8px; cursor: help; }
  .switch { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .switch input { width: 1.1rem; height: 1.1rem; accent-color: var(--sk); margin: 0; }
  .views { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .views button { background: none; border: 0; padding: 6px 12px; display: flex; gap: 6px; align-items: center; }
  .views button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

  .stage:focus { outline: none; }
  .stage { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
  .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
  .time { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
  .tag, .sel, .again { display: inline-flex; align-items: center; gap: 4px; }
  .again { color: var(--warn); }
  .sel { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .dots { margin-left: auto; display: flex; gap: 3px; }
  .dots i { width: .55rem; height: .55rem; border-radius: 50%; border: 1.5px solid var(--muted); }
  .dots i.on { background: var(--ok); border-color: var(--ok); }
  .act { display: flex; align-items: center; gap: 14px; }
  .act > div { min-width: 0; display: grid; gap: 2px; }
  .action { font-size: 1.35rem; line-height: 1.15; }
  .sit { color: var(--muted); }
  .sugs, .tools, .seq { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .sug { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .sug.grp { border-color: var(--sc); border-style: dashed; }
  .sug:hover { background: var(--key); }
  .sugs { display: grid; justify-items: start; }
  .others { display: flex; flex-wrap: wrap; gap: 8px; }
  .sug { display: inline-grid; gap: 3px; justify-items: start; text-align: left; }
  .sug .combo { display: inline-flex; align-items: center; gap: 4px; }
  .why { font-size: .8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .why kbd { font-size: .72rem; padding: 0 4px; }
  .sug.main { padding: 10px 16px; border-color: var(--sk); border-style: solid; box-shadow: inset 0 0 0 1px var(--sk); }
  .sug.main .combo kbd { font-size: 1.15rem; }
  .sug.main .why { font-size: .95rem; color: var(--ink); }
  .sug.main.grp { border-color: var(--sc); box-shadow: inset 0 0 0 1px var(--sc); }
  .k.ref, .btn.ref { outline: 2px dashed var(--ink); outline-offset: 5px; }
  .go { background: var(--sk); color: var(--s-ink); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .go:disabled { opacity: .45; cursor: default; }
  .stars { display: inline-flex; margin-left: 4px; }
  .meets { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; font-size: .8rem; }
  .meets li { display: inline-flex; align-items: center; gap: 3px; }
  .meets .na, .meets .off { color: var(--muted); }
  .meets .na .ic { opacity: .45; }
  .meets .off { text-decoration: line-through; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; }
  .ghost:disabled { opacity: .45; cursor: default; }
  .seq .step.done { opacity: .4; }
  .seq .step.next kbd { background: var(--sk); color: var(--s-ink); border-color: var(--sk); }
  .score { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: 1.1rem; font-weight: 700; }
  .msg { min-height: 1.6em; display: flex; align-items: center; gap: 6px; color: var(--warn); font-weight: 500; }
  .msg.note { color: var(--ok); }

  .play { display: grid; gap: 12px; }
  .kbscroll { overflow-x: auto; }
  .kb { --u: 3.3rem; display: grid; gap: 4px; width: max-content; }
  .row { display: flex; gap: 4px; }
  .mouse { margin-top: 6px; }
  .k {
    position: relative; width: calc(var(--u) * var(--w, 1) - 4px); height: calc(var(--u) * .95);
    background: var(--key); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px;
    padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-weight: 700; font-size: .95rem; line-height: 1.1;
  }
  .k.long { font-size: .72rem; }
  .k .ics { display: flex; gap: 1px; color: var(--muted); }
  .k .ics .ic { width: .9rem; height: .9rem; }
  .held { font-size: .8rem; }
  .pas { position: absolute; bottom: 1px; right: 2px; font: 700 .55rem var(--body); font-style: normal; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 0 3px; }
  .k.grid { background: var(--grid); }
  .k.rest { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .k.res { background: transparent; border-style: dashed; color: var(--muted); font-weight: 500; }
  .k.conflict { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-style: solid; }
  .k.sk { background: var(--sk); border-color: var(--sk); color: var(--s-ink); border-style: solid; }
  .k.sc { background: var(--sc); border-color: var(--sc); color: var(--s-ink); border-style: solid; }
  .k.peek { outline: 3px solid var(--sk); outline-offset: 1px; }
  .k.conflict .ics, .k.sk .ics, .k.sc .ics { color: inherit; }
  .hold { transform: translateY(2px); border-bottom-width: 1px !important; }
  .tap { animation: tap 1.4s ease-in-out 3; }
  .tap2 { animation: tap2 1.4s ease-in-out 3; }
  @keyframes tap { 0%, 55%, 100% { transform: none; } 25% { transform: translateY(3px); } }
  @keyframes tap2 { 0%, 50%, 100% { transform: none; } 12%, 32% { transform: translateY(3px); } 22% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .tap, .tap2 { animation: none; } }

  .pad-area { display: grid; gap: 8px; justify-items: start; }
  .pad { position: relative; width: 100%; max-width: 34rem; aspect-ratio: 2.2 / 1; }
  .mouse-shape { position: absolute; left: 77%; top: 10%; width: 18%; height: 82%; border: 2px solid var(--line); border-radius: 46% 46% 50% 50%; }
  .slot { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; }
  .btn { width: clamp(3.2rem, 11vw, 4.4rem); aspect-ratio: 1; border-radius: 50%; background: var(--key); border: 2px solid var(--line); border-bottom-width: 5px;
    display: grid; place-content: center; justify-items: center; line-height: 1.05; }
  .btn small { font-size: .6rem; color: var(--muted); }
  .btn b { font-size: .95rem; }
  .btn .ics { display: flex; gap: 1px; }
  .btn .ics .ic { width: .85rem; height: .85rem; }
  .btn.cur { border-color: var(--sk); border-style: dashed; }
  .btn.mod { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--sc); }
  .btn.sk { background: var(--sk); border-color: var(--sk); color: var(--s-ink); }
  .btn.sk small { color: inherit; }
  .move { font-size: .8rem; font-weight: 700; color: var(--sk); white-space: nowrap; }
  body:not([data-view="manette"]) .pad-area { display: none; }
  body[data-view="manette"] .kbscroll:not(.open) { display: none; }

  .legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
  .legend li { display: inline-flex; align-items: center; gap: 4px; }
  .legend kbd { font-size: .75rem; }

  .recap { display: grid; gap: 12px; }
  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); gap: 16px; }
  .lists section { display: grid; gap: 6px; align-content: start; }
  .lists ul { list-style: none; margin: 0; padding: 0; display: grid; }
  .lists li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .nm { min-width: 0; }
  .kv { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
  .todo { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
</style>

<main class="wrap">
  <header class="head">
    <h1>Raccourcis AoE IV</h1>
    <span class="pill" title="Anglais, 1 contre 1, âge I. Grille du jeu : projet Aegis et porteur. Minutages et règles du jeu non vérifiés.">Fictif</span>
    <label class="switch" title="Ajoute la grille du jeu et les entraînements"><input type="checkbox" id="training">Entraînement</label>
    <div class="views" role="group" aria-label="Vue">
      <button type="button" id="v-main" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-hand"/></svg>Main posée</button>
      <button type="button" id="v-pad" aria-pressed="false"><svg class="ic" aria-hidden="true"><use href="#i-pad"/></svg>Manette</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-live="polite" tabindex="-1"></section>
  <p class="msg" id="msg" role="status"></p>

  <section class="play">
    <div class="pad-area">
      <div class="pad" id="pad"></div>
      <button class="ghost" id="drawer" type="button" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-kb"/></svg>Clavier</button>
    </div>
    <div class="kbscroll" id="kbscroll"><div class="kb" id="kb"></div></div>
    <ul class="legend">
      <li><kbd>G</kbd>appui</li>
      <li><kbd>G</kbd><b class="x2">x2</b>double</li>
      <li><kbd>Alt</kbd><b class="plus">+</b><kbd>G</kbd>maintenu</li>

  const [first, second] = value.split(' + ');
  return { mod: second ? first : null, key: (second || first).replace(/ x2$/, ''), double: / x2$/.test(value) };
}

//   { type: 'mode', training } : l'interrupteur « entraînement » (désactivé par défaut).
function groupsOf(history) {
  return history.filter((h) => h.type === 'group').reduce((g, h) => ({ ...g, [h.digit]: h.element }), {});

function groupModOf(history) {
  const first = history.find((h) => h.type === 'group');
  return first ? first.mod : null;
}

// Réponses encore valables : un groupe dont l'élément a été remplacé ne compte plus.

  const groups = groupsOf(history);

// La caméra a toujours sa propre touche (porteur) ; un entraînement qui dépend d'une action laissée de côté est sauté.

  const training = trainingOf(history);
  if (m.final) {
    const answered = new Set(history.filter((h) => h.type === 'answer' && h.moment === moment).map((h) => h.action));
    const action = [...declined].find((a) => !settled[a] && !answered.has(a));
    return action ? { moment, action, kind: kindOf(action) } : null;
  }
  if (m.drill) {
    const d = DRILLS[m.drill];
    const needs = d.stay ? d.needs : [...d.needs, 'camera'];
    if (needs.some((id) => declined.has(id))) return null;
    const missing = needs.find((id) => !settled[id]);
    if (missing) return { moment, action: missing, kind: kindOf(missing) };
    return training ? { moment, action: m.drill, kind: 'drill' } : null;
  }
  if (settled[m.action] || declined.has(m.action) || (ACTIONS[m.action].grid && !training)) return null;
  return { moment, action: m.action, kind: kindOf(m.action) };
}

function currentStep(history) {
  const settled = settledOf(history);
  const last = history.filter((h) => h.type === 'answer').pop();
  // Un entraînement reste à faire au même moment après avoir réglé la touche qui lui manquait (sauf si elle a été ignorée) ;
  // le rattrapage final reste ouvert tant qu'il lui reste des actions.
  const sameMoment = last && ((last.key && MOMENTS[last.moment].drill && last.action !== MOMENTS[last.moment].drill) || MOMENTS[last.moment].final);
  const from = !last ? 0 : sameMoment ? last.moment : last.moment + 1;
  for (let i = from; i < MOMENTS.length; i++) {
    const step = stepAt(history, settled, i);
    if (step) return step;
  }
  return null;
}

// Élément sélectionné : la cible d'un entraînement dès sa première touche, celui de l'étape s'il l'est d'office, sinon le dernier sélectionné.
function selectionOf(history, step, typed = []) {
  if (step && step.kind === 'drill' && typed.length) return DRILLS[step.action].after || null;
  const now = step && step.kind !== 'drill' && ACTIONS[step.action].selects;
  if (now) return now;
  const subject = (h) => { const a = ACTIONS[h.action] || DRILLS[h.action]; return h.type === 'answer' && h.key && (a.selects || a.after); };
  const last = [...history].reverse().find(subject);
  return last ? subject(last) : null;
}

// Conflit en jeu : la grille (sauf maintenue par Alt, Mouse 4 ou Mouse 5), un raccourci identique, ou une touche seule
// qui déclencherait aussi un autre raccourci (modificateur d'une combinaison ou des groupes, premier appui d'un double appui).
// Exception (porteur) : dans la famille caméra, une touche seule et son double appui se complètent (Espace, puis Espace x2 pour l'alerte).
function conflictOf(history, value, verb) {
  const settled = settledOf(history);
  const v = partsOf(value);
  if (keyOf(v.key).zone === 'grille' && !GRID_MODS.includes(v.mod)) return GRID;
  const groupMod = groupModOf(history);
  if (!v.mod && v.key === groupMod) return { name: `la creation des groupes (${groupMod} + chiffre)`, short: 'groupes' };
  for (const id of bindingsOf(settled)) {
    const w = partsOf(settled[id]);
    const cameraPair = verb === 'camera' && ACTIONS[id].verb === 'camera';
    if (settled[id] === value
      || (!v.mod && w.mod === v.key)
      || (v.mod && !w.mod && w.key === v.mod)
      || (!v.mod && !w.mod && v.key === w.key && v.double !== w.double && !cameraPair)) return ACTIONS[id];
  }
  return null;
}

// Doigt qui couvre une touche et distance à sa touche de référence : le pouce droit couvre la souris, le pouce la rangée du bas,
// les autres doigts la colonne la plus proche.
function reachOf(posture, keyId) {
  if (keyOf(keyId).mouse) return { finger: 'pouce droit', effort: posture['pouce droit'] === keyId ? 0 : 1 };
  const p = POS[keyId];
  const fingers = p.row === 5 ? ['pouce'] : ['auriculaire', 'annulaire', 'majeur', 'index'];
  const finger = fingers.reduce((best, f) => Math.abs(POS[posture[f]].x - p.x) < Math.abs(POS[posture[best]].x - p.x) ? f : best);
  const ref = POS[posture[finger]];
  return { finger, effort: Math.abs(ref.x - p.x) + Math.abs(ref.row - p.row) };
}

// Effort d'un raccourci : somme des déplacements ; le doigt retenu est celui qui bouge le plus. Un seul doigt pour deux touches : injouable.
function costOf(posture, value) {
  const v = partsOf(value);
  const k = reachOf(posture, v.key);
  if (!v.mod) return k;
  const m = reachOf(posture, v.mod);
  return m.finger === k.finger ? { finger: k.finger, effort: Infinity } : { finger: m.effort > k.effort ? m.finger : k.finger, effort: m.effort + k.effort };
}

const keyed = (settled, id) => isShortcut(id) && !ACTIONS[id].grid && settled[id] && !groupDigit(settled[id]);

// Deux logiques de familles, calculées toutes les deux (porteur) : par geste (caméra, un, tous) ou par domaine
// (économie, militaire ; la caméra à part).
const LOGICS = { geste: (a) => a.verb, domaine: (a) => (a.verb === 'camera' ? 'camera' : a.domain) };
const DOMAIN_NAMES = { eco: "de l'économie", mil: 'du militaire' };

// Logiques encore possibles : même famille si et seulement si même mécanique (la touche seule reste commune).
// Le premier choix qui les départage fixe la logique ; si aucune ne tient, la logique par geste.
function logicsOf(settled) {
  const used = Object.keys(settled).filter((id) => keyed(settled, id) && mechanicOf(settled[id]) !== 'seule');
  const holds = (l) => used.every((p) => used.every((q) =>
    (LOGICS[l](ACTIONS[p]) === LOGICS[l](ACTIONS[q])) === (mechanicOf(settled[p]) === mechanicOf(settled[q]))));
  const ok = Object.keys(LOGICS).filter(holds);
  return ok.length ? ok : ['geste'];
}

// Famille d'actions : son premier raccourci réglé (hors groupes de contrôle) en fixe la mécanique.
const teacherIn = (settled, logic, family) => Object.keys(settled).find((id) => keyed(settled, id) && LOGICS[logic](ACTIONS[id]) === family);

// Le double appui et chaque touche maintenue n'appartiennent qu'à une famille ; la touche seule reste commune.
const takenIn = (settled, logic, family) => Object.keys(settled)
  .filter((id) => keyed(settled, id) && LOGICS[logic](ACTIONS[id]) !== family).map((id) => mechanicOf(settled[id])).filter((m) => m !== 'seule');

const elementOf = (id) => ACTIONS[id].of || id;

// Critères d'intuitivité (porteur) : place de l'élément dans la grille du jeu, mécanique de la famille, doigts immobiles,
// même touche que l'élément. true, false, ou null = sans objet (compté comme rempli). La famille vaut dans une logique encore
// possible où la mécanique est libre ; l'alerte sur la touche de la caméra en double appui suit la famille caméra (exception du porteur).
// Une touche par élément : la touche déjà prise par son élément, sinon une touche qu'aucun autre élément n'a prise.
// like = action qui fixe la famille ; same = action du même élément qui fixe la touche.
function meetsOf(settled, id, value, logics = logicsOf(settled)) {
  const posture = postureOf(settled);
  const d = groupDigit(value);
  if (d) return { grille: null, famille: null, doigts: reachOf(posture, d).effort === 0, element: null, like: null, same: null };
  const a = ACTIONS[id];
  const m = mechanicOf(value);
  const key = partsOf(value).key;
  const others = Object.keys(settled).filter((x) => x !== id && keyed(settled, x));
  const same = others.find((x) => elementOf(x) === elementOf(id));
  const element = same ? partsOf(settled[same]).key === key : others.some((x) => partsOf(settled[x]).key === key) ? false : null;
  const cameraTwin = a.verb === 'camera' && m === 'double' && element === true;
  const open = logics.filter((l) => !takenIn(settled, l, LOGICS[l](a)).includes(m)).map((l) => teacherIn(settled, l, LOGICS[l](a)));
  const like = open.find((t) => t && (mechanicOf(settled[t]) === m || cameraTwin));
  const famille = like ? true : open.some((t) => !t) ? null : false;
  return { grille: a.place ? key === a.place : null, famille, doigts: costOf(posture, value).effort === 0, element, like: like || null, same: same || null };
}

// Une étoile par critère rempli, de 0 à 4.
const CRITERIA_KEYS = ['grille', 'famille', 'doigts', 'element'];
const starsOf = (meets) => CRITERIA_KEYS.filter((k) => meets[k] !== false).length;

// Raccourcis possibles : touche seule, double appui ou touche maintenue + touche. Une touche maintenable ne sert jamais seule,
// et le repos du pouce reste à la famille caméra.
function candidates(history, posture, a) {
  const usable = KEYS.filter((k) => !k.reserved && !MODS.includes(k.id));
  const alone = usable.filter((k) => k.zone !== 'grille' && (a.verb === 'camera' || k.id !== posture.pouce)).flatMap((k) => [k.id, `${k.id} x2`]);
  const combos = MODS.flatMap((m) => usable.filter((k) => k.zone !== 'grille' || GRID_MODS.includes(m)).map((k) => `${m} + ${k.id}`));
  return [...alone, ...combos]
    .filter((v) => !conflictOf(history, v, a.verb))
    .map((v) => ({ key: v, mechanic: mechanicOf(v), keyFinger: reachOf(posture, partsOf(v).key).finger, ...costOf(posture, v) }))
    .filter((c) => c.effort < Infinity);
}

// Départage : étoiles, effort, mécanique la plus simple, puis la touche sous l'index d'abord.
const byLogic = (p, q) => q.stars - p.stars || p.effort - q.effort
  || MECHANICS.indexOf(p.mechanic) - MECHANICS.indexOf(q.mechanic)
  || FINGERS.indexOf(p.keyFinger) - FINGERS.indexOf(q.keyFinger);

// Suggestions (3 au plus) : la meilleure, au premier raccourci d'un domaine une touche maintenue réservée à ce domaine
// (proposée sans être imposée), puis la meilleure de chaque autre mécanique ; le double appui en dernier recours,
// sauf l'alerte sur la touche de la caméra. Pour un élément, aussi un groupe de contrôle, proposé d'abord pour l'armée et la production.
function suggest(history) {
  const settled = settledOf(history);
  const step = currentStep(history);
  const a = ACTIONS[step.action];
  if (step.kind === 'finger') {
    const text = step.action === 'pouce droit' ? 'Le pouce droit repose sur un bouton latéral.' : "Repère : le relief de F sous l'index.";
    return { keys: [{ key: fingerDefault(settled, step.action), stars: null, why: { text, ref: null } }], combo: null, groupFirst: false };
  }
  const posture = postureOf(settled);
  const combo = a.element ? comboFor(history, posture, step.action) : null;
  const groupFirst = !!combo && (a.groupOnly || a.groupFirst);
  if (a.groupOnly) return { keys: [], combo, groupFirst };
  const logics = logicsOf(settled);
  const all = candidates(history, posture, a)
    .filter((c) => logics.some((l) => !takenIn(settled, l, LOGICS[l](a)).includes(c.mechanic)))
    .map((c) => { const meets = meetsOf(settled, step.action, c.key, logics); return { ...c, meets, stars: starsOf(meets) }; });
  const plain = all.filter((c) => c.mechanic !== 'double' || (a.verb === 'camera' && c.meets.element));
  const sorted = (plain.length ? plain : all).sort(byLogic);
  const firstOfDomain = a.domain && logics.includes('domaine') && !Object.keys(settled).some((id) => keyed(settled, id) && ACTIONS[id].domain === a.domain);
  const reserved = firstOfDomain && sorted.find((c) => GRID_MODS.includes(c.mechanic) && !takenIn(settled, 'domaine', a.domain).includes(c.mechanic));
  const firsts = sorted.filter((c, i) => sorted.findIndex((d) => d.mechanic === c.mechanic) === i);
  const picks = [...new Set([sorted[0], reserved, ...firsts].filter(Boolean))].slice(0, 3);
  const keys = picks.map((c) => ({ key: c.key, stars: c.stars, meets: c.meets,
    why: c === reserved ? { text: `Touche ${DOMAIN_NAMES[a.domain]} : ${c.mechanic}`, ref: null } : whyOf(c, c.meets.element && c.meets.same, c.meets.like, a.place) }));
  return { keys, combo, groupFirst };
}

// Groupe proposé : le sien s'il existe ; sinon le chiffre libre le plus proche du dernier groupe du même bloc
// (au-dessus d'abord), ou du numéro habituel si le bloc est encore vide.
function comboFor(history, posture, id) {
  const a = ACTIONS[id];
  const groups = groupsOf(history);
  const mod = groupModOf(history) || 'Ctrl';
  const settled = settledOf(history);
  const rated = (d) => { const meets = meetsOf(settled, id, `groupe ${d}`); return { meets, stars: starsOf(meets) }; };
  const own = DIGITS.find((d) => groups[d] === a.selects);
  if (own) return { digit: own, mod, create: false, ...rated(own), why: { text: `Ton groupe ${own}`, ref: id } };
  const block = GROUP_BLOCKS.find((b) => b.includes(a.selects));
  const last = [...history].reverse().find((h) => h.type === 'group' && block.includes(h.element) && groups[h.digit] === h.element);
  const anchor = DIGITS.indexOf(last ? last.digit : GROUP_SLOTS[a.selects]);
  const best = DIGITS.filter((d) => !groups[d])
    .sort((p, q) => Math.abs(DIGITS.indexOf(p) - anchor) - Math.abs(DIGITS.indexOf(q) - anchor) || DIGITS.indexOf(q) - DIGITS.indexOf(p))[0];
  const near = last && Object.keys(ACTIONS).find((x) => ACTIONS[x].selects === last.element);
  const text = near ? `À côté de ton groupe ${last.digit}` : `Numéro habituel ${block === GROUP_BLOCKS[0] ? "de l'armée" : 'des bâtiments'}`;
  return best && { digit: best, mod, create: true, ...rated(best), why: { text, ref: near || null } };
}

// Touche par défaut du doigt ; si elle est prise, la première touche libre à droite du doigt précédent, sinon la première libre.
function fingerDefault(settled, finger) {
  const used = POSTURE_FINGERS.map((f) => settled[f]);
  if (!used.includes(ACTIONS[finger].finger)) return ACTIONS[finger].finger;
  const prev = POS[settled[POSTURE_FINGERS[POSTURE_FINGERS.indexOf(finger) - 1]]];
  const free = (k) => POS[k.id] && !used.includes(k.id) && k.id !== 'Échap' && k.id !== 'Win';
  return (KEYS.find((k) => free(k) && POS[k.id].row === prev.row && POS[k.id].x > prev.x) || KEYS.find(free)).id;
}

// Logique d'une suggestion, en une ligne, avec l'action qui l'inspire (ref) : même touche, même geste, place de la grille,
// sinon le mouvement des doigts.
function whyOf(c, twin, like, place) {
  if (twin) return { text: `Même touche que ${ACTIONS[twin].short}`, ref: twin };
  if (like) return { text: `Même geste que ${ACTIONS[like].short}`, ref: like };
  if (place && partsOf(c.key).key === place) return { text: `Même place que dans la grille : ${place}`, ref: null };
  const text = c.effort === 0 ? 'Aucun doigt ne bouge' : `${c.finger[0].toUpperCase()}${c.finger.slice(1)} ${c.effort <= 1.5 ? "bouge d'une touche" : "s'étire"}`;
  return { text, ref: null };
}

function answer(history, step, key) {
  return { history: [...history, { type: 'answer', moment: step.moment, action: step.action, key }] };
}

// value : une touche, une combinaison 'Alt + G' ou un double appui '² x2'.
function choose(history, value) {
  const step = currentStep(history);
  const settled = settledOf(history);
  const v = partsOf(value);
  const key = keyOf(v.key);
  if (step.kind === 'finger') {
    if (v.mod || v.double) return { error: 'Une touche seule par doigt.' };
    if (step.action === 'pouce droit' ? !key.mouse : key.mouse || value === 'Échap' || value === 'Win') {
      return { error: ascii(step.action === 'pouce droit' ? 'Pouce droit : Mouse 4 ou Mouse 5.' : `${value} : pas pour la main gauche.`) };
    }
    const other = POSTURE_FINGERS.find((f) => settled[f] === value);
    if (other) return { error: ascii(`${value} deja pris par ton ${other}.`) };
    return answer(history, step, value);
  }
  if (step.kind === 'select' && key.digit && !v.mod && !v.double) {
    const element = ACTIONS[step.action].selects;
    const inGroup = groupsOf(history)[value];
    if (inGroup === element) return answer(history, step, `groupe ${value}`);
    const c = comboFor(history, postureOf(settled), step.action);
    const hint = !c ? '' : c.create ? ` Libre : ${c.mod} + ${c.digit}.` : ` Le tien : ${c.digit}.`;
    const mod = groupModOf(history) || 'Ctrl';
    return { error: ascii(inGroup ? `Groupe ${value} = ${inGroup}.${hint}` : `Groupe ${value} vide : ${mod} + ${value} d'abord.`) };
  }
  if (v.mod && (MODS.includes(v.key) || key.reserved)) return { error: ascii(`${value} : combinaison impossible.`) };
  if (v.mod && key.zone === 'grille' && !GRID_MODS.includes(v.mod)) return { error: 'Grille : avec Alt, Mouse 4 ou 5.' };
  if (!v.mod && key.reserved) return { error: ascii(key.reserved) };
  const holder = conflictOf(history, value, ACTIONS[step.action].verb);
  if (holder) return { error: ascii(`${value} deja pris : ${holder.short}.`) };
  return answer(history, step, value);
}

// Modificateur + chiffre, à n'importe quelle étape de la partie : la sélection actuelle remplace le contenu du groupe, comme dans le jeu.
function assignGroup(history, digit, typed = [], mod = 'Ctrl') {
  const step = currentStep(history);
  const element = step && step.kind !== 'finger' && selectionOf(history, step, typed);
  if (!element) return { error: 'Rien de selectionne.' };
  const groupMod = groupModOf(history);
  if (groupMod && mod !== groupMod) return { error: ascii(`Groupes : ${groupMod} + chiffre.`) };
  const settled = settledOf(history);
  const solo = !groupMod && bindingsOf(settled).find((id) => partsOf(settled[id]).key === mod && !partsOf(settled[id]).mod);
  if (solo) return { error: ascii(`${mod} seul deja pris.`) };
  const next = [...history, { type: 'group', digit, element, mod }];
  const lost = Object.keys(settled).find((a) => !settledOf(next)[a]);
  const note = lost ? `Groupe ${digit} remplace : ${ACTIONS[lost].short} a refaire.`
    : step.kind === 'select' && element === ACTIONS[step.action].selects ? `Groupe ${digit} = ${element}. Appuie ${digit}.`
    : `Groupe ${digit} = ${element}.`;
  return { history: next, note: ascii(groupMod ? note : `${note} ${mod} cree les groupes.`) };
}

function skip(history) {
  const step = currentStep(history);
  return answer(history, step, null).history;
}

// Ne pas utiliser ce raccourci : aucune touche maintenant, l'action revient en extra au rattrapage de la fin.
function decline(history) {
  const step = currentStep(history);
  return [...history, { type: 'answer', moment: step.moment, action: step.action, key: null, declined: true }];
}

function skippedAt(history, actionId) {
  return history.filter((h) => h.type === 'answer' && !h.key && !h.declined && h.action === actionId).map((h) => MOMENTS[h.moment].at);
}

// Séquence à faire, appui par appui : la grille du jeu, ou l'entraînement (sélections, caméra sauf « stay », puis then).
// Un groupe se sélectionne d'un appui, et deux appuis centrent aussi la caméra.
function sequenceOf(settled, step) {
  if (step.kind === 'grid') return ACTIONS[step.action].grid;
  const d = DRILLS[step.action];
  const presses = (value) => (partsOf(value).double ? [partsOf(value).key, partsOf(value).key] : [value]);
  const select = (value) => (groupDigit(value) ? (d.stay ? [groupDigit(value)] : [groupDigit(value), groupDigit(value)]) : presses(value));
  const camera = d.stay || d.needs.every((id) => groupDigit(settled[id])) ? [] : presses(settled.camera);
  return [...d.needs.flatMap((id) => select(settled[id])), ...camera, ...(d.then || [])];
}

// typed = appuis déjà faits de la séquence ; une erreur fait recommencer la séquence.
function train(history, typed, value) {
  const step = currentStep(history);
  const seq = sequenceOf(settledOf(history), step);
  if (seq[typed.length] !== value) return { typed: [], error: ascii(`Pas ${value} : recommence.`) };
  if (typed.length + 1 < seq.length) return { typed: [...typed, value] };
  return { typed: [], history: answer(history, step, step.kind === 'grid' ? 'grille' : 'fait').history };
}
</script>

<script>
// Auto-test de la logique : parcours réels puis cas limites ; une erreur s'affiche dans la console.
(function selfTest() {
  const check = (ok, what) => { if (!ok) throw new Error('Auto-test P1 en echec : ' + what); };
  const T = [{ type: 'mode', training: true }];
  const doSeq = (h) => sequenceOf(settledOf(h), currentStep(h)).reduce((r, k) => train(r.history || h, r.typed, k), { typed: [] }).history;
  const viaGroup = (h) => { const c = suggest(h).combo; return choose(c.create ? assignGroup(h, c.digit, [], c.mod).history : h, c.digit).history; };
  // Comme Suivant : la suggestion pré-sélectionnée (le groupe d'abord s'il est proposé en premier).
  const best = (h) => { const s = suggest(h); return s.groupFirst || !s.keys.length ? viaGroup(h) : choose(h, s.keys[0].key).history; };
  const play = (h, onSelect = best) => {
    for (let step = currentStep(h); step; step = currentStep(h)) {
      h = step.kind === 'grid' || step.kind === 'drill' ? doSeq(h) : step.kind === 'select' ? onSelect(h) : best(h);
    }
    return h;
  };
  const shortcuts = (h) => Object.entries(settledOf(h)).filter(([a]) => isShortcut(a) && !ACTIONS[a].grid).map(([a, k]) => `${a}=${k}`).join(' ');
  const done = (h, key) => h.filter((e) => e.key === key).length;
  const posture = (keys, start = T) => keys.reduce((h, k) => choose(h, k).history, start);
  const base = posture(['Q', 'S', 'D', 'F', 'Espace', 'Mouse 4']);
  const until = (h, action) => { while (currentStep(h).action !== action) h = currentStep(h).kind === 'grid' || currentStep(h).kind === 'drill' ? doSeq(h) : best(h); return h; };
  const names = (h) => suggest(h).keys.map((k) => k.key).join();

  // Parcours complets jusqu'à l'âge IV : familles par geste, caméra sur le repos du pouce, alerte en double appui, armée en groupes.
  const keysOnly = play(T);
  check(shortcuts(keysOnly) === 'selectTc=Mouse 4 + F scout=Mouse 4 + D camera=Espace idle=Mouse 4 + S idleAll=Mouse 5 + S allBarracks=groupe 6 '
    + 'allRanges=groupe 7 meleeScreen=G melee=groupe 1 rangedScreen=< ranged=groupe 2 rally=Mouse 5 + Q idleMil=Mouse 5 + R cancelUnit=B allStables=groupe 8 '
    + 'cavalryScreen=Tab cavalry=groupe 3 allTc=Mouse 5 + F allWorkshops=groupe 9 siegeScreen=² siege=groupe 4 alert=Espace x2 monasteries=groupe 0 monk=Mouse 4 + A', 'partie = ' + shortcuts(keysOnly));
  check(done(keysOnly, 'fait') === 17 && done(keysOnly, 'grille') === 16, 'entrainement : 17 sequences, 16 grilles');
  const quick = play(posture(['Q', 'S', 'D', 'F', 'Espace', 'Mouse 4'], []));
  check(shortcuts(quick) === shortcuts(keysOnly) && !done(quick, 'fait') && !done(quick, 'grille'), 'sans entrainement = ' + shortcuts(quick));
  const groupsOnly = play(T, viaGroup);
  check(shortcuts(groupsOnly).startsWith('selectTc=groupe 5 scout=Mouse 4 + F camera=Espace idle=Mouse 4 + D idleAll=Mouse 5 + D'), 'groupes = ' + shortcuts(groupsOnly));

  // Premier choix d'une famille : une suggestion par mécanique, sans double appui (dernier recours) ; une autre posture donne d'autres suggestions.
  check(names(base) === 'Mouse 4 + F,G,Mouse 5 + F' && suggest(base).keys[0].stars === 4, 'premier choix = ' + names(base));
  const thumbOnAlt = posture(['Maj', 'S', 'D', 'F', 'Alt', 'Mouse 5']);
  check(names(thumbOnAlt).startsWith('Alt + F,Mouse 5 + F') && suggest(thumbOnAlt).keys[0].stars === 4, 'pouce sur Alt = ' + names(thumbOnAlt));
  // Deux logiques calculées (par geste, par domaine) : au premier raccourci militaire, une touche maintenue réservée au militaire
  // est proposée sans être pré-sélectionnée ; le choix qui départage les logiques fixe celle de l'utilisateur.
  const atScout = until(choose(base, 'Mouse 4 + F').history, 'scout');
  check(names(atScout) === 'Mouse 4 + D,Mouse 5 + D,G' && /militaire/.test(suggest(atScout).keys[1].why.text), 'eclaireur = ' + names(atScout));
  check(logicsOf(settledOf(atScout)).join() === 'geste,domaine', 'deux logiques possibles avant l eclaireur');
  const byDomain = choose(atScout, 'Mouse 5 + D').history;
  check(logicsOf(settledOf(byDomain)).join() === 'domaine' && logicsOf(settledOf(choose(atScout, 'Mouse 4 + D').history)).join() === 'geste', 'le choix fixe la logique');
  check(suggest(until(byDomain, 'allBarracks')).keys[0].key.startsWith('Mouse 5 + ') && suggest(until(byDomain, 'idleAll')).keys[0].key.startsWith('Mouse 4 + '),
    'militaire sur Mouse 5, economie sur Mouse 4');
  // Économie après le militaire (centre-ville en groupe) : sa touche réservée est proposée, sans être imposée ni reproposée.
  const milFirst = until(choose(until(viaGroup(base), 'scout'), 'Mouse 4 + F').history, 'idle');
  const ecoKey = suggest(milFirst).keys.find((k) => /économie/.test(k.why.text));
  check(ecoKey && ecoKey.key.startsWith('Mouse 5 + ') && suggest(milFirst).keys[0] !== ecoKey, 'touche de l economie proposee en second = ' + names(milFirst));
  check(!suggest(until(best(milFirst), 'idleAll')).keys.some((k) => /économie/.test(k.why.text)), 'touche de l economie plus reproposee');
  // Étoiles d'intuitivité : une par critère rempli (place de la grille, geste de la famille, doigts immobiles), sans objet = rempli.
  const barracksKey = suggest(until(byDomain, 'allBarracks')).keys[0];
  check(barracksKey.key === 'Mouse 5 + S' && barracksKey.meets.grille && barracksKey.meets.famille && !barracksKey.meets.doigts && barracksKey.stars === 2, 'casernes = ' + barracksKey.key);
  check(starsOf({ grille: false, famille: false, doigts: false, element: false }) === 0 && starsOf({ grille: null, famille: null, doigts: true, element: null }) === 4, 'etoiles de 0 a 4');
  check(suggest(until(base, 'allBarracks')).combo.stars === 3, 'groupe : doigts qui bougent, 3 etoiles');
  // Une touche par élément : « tous » reprend la touche de « prochain » ; une touche d'un autre élément manque le critère.
  const idleAllKey = suggest(until(base, 'idleAll')).keys[0];
  check(idleAllKey.key === 'Mouse 5 + S' && idleAllKey.meets.element && /Même touche que Inactif/.test(idleAllKey.why.text), 'tous les inactifs = ' + idleAllKey.key);
  check(settledOf(keysOnly).allTc === 'Mouse 5 + F', 'tous les centres-villes sur la touche du centre-ville');
  check(meetsOf(settledOf(until(base, 'rally')), 'rally', 'Mouse 5 + F').element === false, 'F appartient au centre-ville');
  // À l'écran avant le groupe : l'infanterie sélectionnée sans souris, puis le groupe 1.
  const afterScreen = best(until(base, 'meleeScreen'));
  check(currentStep(afterScreen).action === 'melee' && selectionOf(afterScreen, currentStep(afterScreen)) === 'mêlée', 'infanterie a l ecran puis groupe 1');
  // L'armée ne passe que par des groupes de contrôle ; la production, d'abord en groupe ; les numéros suivent les joueurs reconnus.
  check(suggest(until(base, 'melee')).keys.length === 0 && suggest(until(base, 'melee')).combo.digit === '1', 'melee en groupe 1 seulement');
  check(suggest(until(base, 'allBarracks')).groupFirst && suggest(until(base, 'allBarracks')).combo.digit === '6', 'casernes : groupe 6 d abord');
  // Groupes adaptatifs : casernes placées sur 4 à la main, les champs de tir vont au plus près (5), avec la logique visible.
  const ownBarracks = until(choose(assignGroup(until(base, 'allBarracks'), '4').history, '4').history, 'allRanges');
  check(suggest(ownBarracks).combo.digit === '5' && suggest(ownBarracks).combo.why.ref === 'allBarracks', 'champs de tir pres du groupe 4 = ' + suggest(ownBarracks).combo.digit);
  check(suggest(atScout).keys[0].why.ref === 'selectTc' && /Même geste/.test(suggest(atScout).keys[0].why.text), 'logique visible : meme geste que le centre-ville');

  // Touches de référence.
  check(choose(posture(['Q', 'S', 'D', 'F', 'Espace']), 'Mouse 5').history && choose(posture(['Q', 'S', 'D', 'F', 'Espace']), 'G').error, 'pouce droit : souris seulement');
  check(choose([], 'Mouse 4').error && choose([], 'Alt + Q').error && choose(posture(['S']), 'S').error && choose([], 'Maj').history, 'main gauche : clavier, touche seule, sans doublon');
  for (const keys of [['D', 'G'], ['Q', 'S', 'D', 'Espace'], ['Q', 'F', 'Ctrl'], ['D', 'T']]) {
    const sug = suggest(posture(keys)).keys[0].key;
    check(choose(posture(keys), sug).history, `suggestion refusee pour ${keys} : ${sug}`);
  }

  // Combinaisons : la grille seulement avec Alt, Mouse 4 ou Mouse 5 ; refusées sur une touche réservée ou un autre modificateur.
  check(choose(base, 'Alt + A').history && choose(base, 'Mouse 5 + G').history && choose(base, 'Mouse 4 + S').history, 'combinaisons acceptees');
  check(/Grille/.test(choose(base, 'Ctrl + A').error) && /Grille/.test(choose(base, 'Maj + S').error), 'grille : ni Ctrl ni Maj');
  check(choose(base, 'Alt + Maj').error && choose(base, 'Alt + Échap').error && choose(base, 'Ctrl').error && choose(base, 'Alt').history, 'combinaisons et touches seules interdites');

  // Touche de création de groupe : détectée au premier groupe, puis seule acceptée.
  const m4 = assignGroup(base, '1', [], 'Mouse 4');
  check(groupModOf(m4.history) === 'Mouse 4' && /Mouse 4 cree/.test(m4.note), 'Mouse 4 devient la touche de creation');
  check(assignGroup(m4.history, '2', [], 'Ctrl').error, 'Ctrl + chiffre refuse apres Mouse 4');
  const m4Scout = until(choose(m4.history, '1').history, 'scout');
  check(/groupes/.test(choose(m4Scout, 'Mouse 4').error), 'Mouse 4 seul en conflit avec la creation des groupes');
  const m4Barracks = until(m4Scout, 'allBarracks');
  check(suggest(m4Barracks).combo.mod === 'Mouse 4' && !suggest(m4Barracks).keys.some((s) => s.key === 'Mouse 4'), 'suggestions avec Mouse 4 + chiffre');
  // Une touche seule déjà prise ne devient pas modificateur, et inversement.
  const scoutOnM4 = choose(until(choose(base, 'G').history, 'scout'), 'Mouse 4').history;
  check(/seul deja pris/.test(assignGroup(scoutOnM4, '3', [], 'Mouse 4').error), 'Mouse 4 seul pris : pas de groupes avec Mouse 4');
  check(choose(until(choose(base, 'Mouse 5 + B').history, 'scout'), 'Mouse 5').error, 'Mouse 5 modificateur : Mouse 5 seul refuse');

  // Doubles appuis : premier appui d'une autre action = conflit, sauf dans la famille caméra ; la grille seule ne peut pas être doublée.
  const dbl = choose(base, '² x2').history;
  check(settledOf(dbl).selectTc === '² x2' && choose(until(dbl, 'scout'), '²').error, 'carre seul en conflit avec carre x2');
  check(choose(base, 'A x2').error, 'A x2 : la grille');
  check(names(until(base, 'alert')).startsWith('Espace x2'), 'alerte en Espace x2 a cote de la camera');
  const atCamDbl = until(dbl, 'camera');
  check(suggest(atCamDbl).keys[0].key === 'Espace' && !suggest(atCamDbl).keys.some((k) => / x2$/.test(k.key)), 'camera sans double appui = ' + names(atCamDbl));
  // Aller-retour avec un double appui puis la caméra ; production d'unités avec Maj = file de 5.
  const cam = until(choose(atCamDbl, 'B').history, 'goBase');
  check(sequenceOf(settledOf(cam), currentStep(cam)).join() === '²,²,B', 'retour : carre, carre, puis B = ' + sequenceOf(settledOf(cam), currentStep(cam)));
  const spear = until(base, 'spearmen');
  check(sequenceOf(settledOf(spear), currentStep(spear)).join() === '6,Maj + A', 'lanciers : groupe des casernes puis Maj + A');

  // Groupes : sélection pendant un aller-retour, remplacement d'un groupe.
  let g = choose(assignGroup(base, '5').history, '5').history;
  g = doSeq(g);
  g = best(g);
  g = best(doSeq(g));
  check(selectionOf(g, currentStep(g), ['5']) === 'centre-ville' && settledOf(assignGroup(g, '5', ['5']).history).selectTc === 'groupe 5', 'apres 5, Ctrl + 5 garde le centre-ville');
  const lost = assignGroup(g, '5');
  check(/a refaire/.test(lost.note) && currentStep(lost.history).action === 'selectTc', 'remplacer le groupe 5 redemande le centre-ville');
  check(assignGroup([], '1').error && assignGroup(posture(['Q']), '1').error, 'rien de selectionne avant la partie');

  // Plus tard : la caméra est redemandée au retour suivant.
  const camAgain = until(skip(until(choose(base, 'G').history, 'camera')), 'camera');
  check(MOMENTS[currentStep(camAgain).moment].at === '1:20', 'camera ignoree : redemandee a 1:20');

  // Ne pas utiliser : le centre-ville saute la partie et ses entraînements, puis revient en extra au rattrapage, avec une suggestion.
  const untilFinal = (h) => { while (!MOMENTS[currentStep(h).moment].final) h = currentStep(h).kind === 'grid' || currentStep(h).kind === 'drill' ? doSeq(h) : best(h); return h; };
  const atFinal = untilFinal(decline(base));
  check(currentStep(atFinal).action === 'selectTc' && isExtra(atFinal, 'selectTc') && suggest(atFinal).keys[0].stars === 3, 'rattrapage du centre-ville = ' + names(atFinal));
  check(done(atFinal, 'fait') === 14, 'sans centre-ville : 3 entrainements en moins, 14 = ' + done(atFinal, 'fait'));
  check(settledOf(best(atFinal)).selectTc && !currentStep(best(atFinal)), 'centre-ville regle au rattrapage, fin');
  check(!currentStep(decline(atFinal)) && !settledOf(decline(atFinal)).selectTc, 'laisse de cote deux fois : sans raccourci');
  const noCam = untilFinal(decline(until(base, 'camera')));
  check(done(noCam, 'fait') === 13 && currentStep(noCam).action === 'camera', 'camera laissee de cote : 4 allers-retours en moins, 13 = ' + done(noCam, 'fait'));

  const errors = [choose(base, 'Échap').error, choose(base, 'Maj').error, choose(base, '5').error, choose(base, 'A').error, choose(base, 'Ctrl + A').error,
    choose(base, 'Alt + Maj').error, choose(dbl, '² x2').error, assignGroup([], '3').error, assignGroup(m4.history, '2', [], 'Ctrl').error];
  check(errors.every((e) => typeof e === 'string' && /^[\x20-\x7e]*$/.test(e) && !/  /.test(e) && e.split(' ').length <= 8), 'message d erreur manquant, non ASCII, mal forme ou trop long : ' + errors.join(' | '));
})();
</script>

<script>
// Page : coque jetable autour du module pur.
let history = [];
let typed = [];
let message = '';
let isNote = false;
let stageHtml = '';
let solo = null;        // modificateur clavier appuyé seul : il ne compte qu'au relâchement
let mouseHeld = null;   // bouton latéral tenu : { id, used } ; seul, il compte au relâchement
let lastPress = null;   // dernier choix d'une touche seule : { value, time, before } pour détecter un double appui
let ctrlArmed = false;
let view = 'main';
let picked = null;      // suggestion cliquée ; elle ne vaut que pour l'historique où elle a été cliquée (pickedFor)
let pickedFor = null;
const MOD_CODES = { ShiftLeft: 'Maj', ControlLeft: 'Ctrl', AltLeft: 'Alt', MetaLeft: 'Win' };
const DOUBLE_MS = 400;
const ABBR = { auriculaire: 'Au', annulaire: 'An', majeur: 'Ma', index: 'In', pouce: 'Po', 'pouce droit': 'PD' };
// Centre de chaque bouton de la manette, en % de sa largeur et de sa hauteur : la main gauche en arc, le pouce droit sur la souris.
const PAD = { auriculaire: [9, 52], annulaire: [23, 28], majeur: [39, 20], index: [54, 30], pouce: [63, 78], 'pouce droit': [86, 50] };
const ELEMENT_ICON = { 'centre-ville': 'tc', 'éclaireur': 'scout', villageois: 'villager', 'centres-villes': 'tcs', casernes: 'barracks', 'champs de tir': 'range',
  'écuries': 'stable', ateliers: 'workshop', militaires: 'army', 'mêlée': 'army', distance: 'range', cavalerie: 'stable', 'siège': 'siege',
  'monastères': 'monastery', moine: 'monk', 'bâtiments militaires': 'rally' };
const $ = (id) => document.getElementById(id);
const buttons = {};
const label = (keyId) => keyId.replace('<', '&lt;');
const esc = (text) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const ic = (id, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const iconOf = (id) => (ACTIONS[id] || DRILLS[id]).icon || 'hand';
const BY_CODE = Object.fromEntries(KEYS.filter((k) => k.code).map((k) => [k.code, k.id]));
const BY_BUTTON = Object.fromEntries(KEYS.filter((k) => k.mouse).map((k) => [k.button, k.id]));
const keyStep = () => currentStep(history);
const modsOf = (e) => [e.ctrlKey && 'Ctrl', e.shiftKey && 'Maj', e.altKey && 'Alt', mouseHeld && mouseHeld.id].filter(Boolean);
// Raccourcis à régler : la grille du jeu est fixe, elle n'entre ni dans la progression ni dans le récapitulatif.
const shortcutIds = () => Object.keys(ACTIONS).filter((id) => isShortcut(id) && !ACTIONS[id].grid);
const heldOf = (settled) => new Set([groupModOf(history), ...bindingsOf(settled).map((id) => partsOf(settled[id]).mod)].filter(Boolean));
const complete = (posture) => POSTURE_FINGERS.every((f) => posture[f]);

function usesOf(settled) {
  const uses = {};
  for (const id of bindingsOf(settled)) (uses[partsOf(settled[id]).key] ||= []).push(id);
  return uses;
}

function starsFor(settled, id) {
  return complete(postureOf(settled)) ? starsOf(meetsOf(settled, id, settled[id])) : null;
}

function scoreOf(settled) {
  const ids = shortcutIds();
  return { got: ids.reduce((sum, id) => sum + (settled[id] ? starsFor(settled, id) || 0 : 0), 0), max: ids.length * 4 };
}

const starsHtml = (n) => (n != null ? `<span class="stars" title="${n} sur 4">${[1, 2, 3, 4].map((i) => ic('star', i <= n ? 'star on' : 'star')).join('')}</span>` : '');

function caps(value) {
  const v = partsOf(value);
  return `${v.mod ? `<kbd>${label(v.mod)}</kbd><b class="plus">+</b>` : ''}<kbd>${label(v.key)}</kbd>${v.double ? '<b class="x2">x2</b>' : ''}`;
}

const groupCaps = (mod, digit, create) => `${ic('flag')}${create ? `${caps(`${mod} + ${digit}`)}${ic('arrow')}` : ''}<kbd>${digit}</kbd>`;

// Suggestion que Suivant retient : celle cliquée à cette étape, sinon la meilleure ; 'groupe' = la suggestion de groupe.
function selectedOf(sug) {
  const keys = sug.keys.map((s) => s.key);
  const options = !sug.combo ? keys : sug.groupFirst ? ['groupe', ...keys] : [...keys, 'groupe'];
  return pickedFor === history && options.includes(picked) ? picked : options[0];
}

// Geste à montrer : la séquence attendue, sinon la suggestion retenue.
function gestureOf(step, sug, seq) {
  const chosen = step && !seq && selectedOf(sug);
  const c = sug.combo;
  const value = !step ? null : seq ? seq[typed.length] : chosen === 'groupe' ? (c.create ? `${c.mod} + ${c.digit}` : c.digit) : chosen;
  return value ? partsOf(value) : null;
}

const gestureClass = (g, keyId) => (!g || !keyId ? '' : g.mod === keyId ? 'hold' : g.key === keyId ? (g.double ? 'tap2' : 'tap') : '');

function buildKeyboard() {
  for (let row = 0; row <= 6; row++) {
    const line = document.createElement('div');
    line.className = row === 6 ? 'row mouse' : 'row';
    for (const key of KEYS.filter((k) => k.row === row)) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.key = key.id;
      b.style.setProperty('--w', key.w || 1);
      line.append(b);
      buttons[key.id] = b;
    }
    $('kb').append(line);
  }
  // Clic sur le clavier dessiné : un modificateur clavier tenu forme une combinaison.
  $('kb').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    solo = null;
    const mods = modsOf(e);
    if (mouseHeld) mouseHeld.used = true;
    if (mods.length === 1 && !MODS.includes(b.dataset.key)) modified(mods[0], b.dataset.key); else input(b.dataset.key);
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Backspace' && (history.length || typed.length)) { e.preventDefault(); if (mouseHeld) mouseHeld.used = true; if (!e.repeat) back(); return; }
    if (!keyStep()) return;
    if (MOD_CODES[e.code] && mouseHeld) { e.preventDefault(); if (!e.repeat) { mouseHeld.used = true; modified(mouseHeld.id, MOD_CODES[e.code]); } return; }
    if (MOD_CODES[e.code]) { e.preventDefault(); if (!e.repeat) solo = e.code; return; }
    solo = null;
    const mods = modsOf(e);
    if (e.metaKey || mods.length > 1) return;
    if (e.code !== 'Escape' && !BY_CODE[e.code]) {
      if (e.target.closest && e.target.closest('#kb')) e.preventDefault();
      if (e.code !== 'Enter') outside(e.key);
      return;
    }
    e.preventDefault();
    if (e.repeat) return;
    if (mouseHeld) mouseHeld.used = true;
    if (mods.length) modified(mods[0], BY_CODE[e.code]);
    else if (e.code === 'Escape') ignore();
    else input(BY_CODE[e.code]);
  });
  document.addEventListener('keyup', (e) => {
    if (e.code !== solo || !keyStep()) return;
    e.preventDefault();
    solo = null;
    input(BY_CODE[e.code]);
  });
  window.addEventListener('blur', () => { solo = null; mouseHeld = null; });
  document.addEventListener('wheel', () => { solo = null; }, { passive: true });
  // Mouse 4 et Mouse 5 : tenus, ce sont des modificateurs ; relâchés seuls, des touches. La navigation du navigateur est bloquée.
  for (const type of ['mousedown', 'mouseup', 'auxclick']) {
    document.addEventListener(type, (e) => {
      const id = BY_BUTTON[e.button];
      if (!id) return;
      e.preventDefault();
      solo = null;
      if (!keyStep()) return;
      if (type === 'mousedown' && mouseHeld && mouseHeld.id !== id) { mouseHeld.used = true; modified(mouseHeld.id, id); return; }
      if (type === 'mousedown') mouseHeld = { id, used: false };
      if (type === 'mouseup' && mouseHeld && mouseHeld.id === id) {
        const held = mouseHeld;
        mouseHeld = null;
        const mods = modsOf(e);
        if (!held.used) mods.length === 1 ? modified(mods[0], id) : input(id);
      }
    });
  }
}

// Modificateur + chiffre : un groupe ; modificateur + autre touche : une combinaison.
function modified(mod, keyId) {
  if (keyOf(keyId).digit && keyStep().kind !== 'finger') return group(keyId, mod);
  input(`${mod} + ${keyId}`);
}

// La touche de création de groupe seule (Ctrl par défaut) arme une combinaison : secours si le navigateur intercepte Ctrl + chiffre,
// ou pour le clavier dessiné. Un second appui rapide sur une même touche forme un double appui.
function input(value) {
  const step = keyStep();
  if (!step) return;
  const groupMod = groupModOf(history) || 'Ctrl';
  if (value === groupMod && step.kind !== 'finger') {
    ctrlArmed = !ctrlArmed;
    say(ctrlArmed ? ascii(`${groupMod} : choisis un chiffre.`) : '', true);
    render();
    return;
  }
  if (ctrlArmed && keyOf(value) && keyOf(value).digit) return group(value, groupMod);
  ctrlArmed = false;
  const now = performance.now();
  const previous = lastPress;
  lastPress = null;
  if (previous && previous.value === value && now - previous.time < DOUBLE_MS) return doubled(previous.before, value);
  const before = history;
  press(value);
  if ((step.kind === 'key' || step.kind === 'select') && keyOf(value) && !keyOf(value).digit) lastPress = { value, time: now, before };
}

function say(text, note = false) {
  message = text || '';
  isNote = note;
}

// Second appui rapide : le choix fait au premier appui devient un double appui.
function doubled(before, value) {
  const result = choose(before, `${value} x2`);
  say(result.error || ascii(`Double appui : ${value} x2.`), !result.error);
  if (result.history) history = result.history;
  typed = [];
  render();
  refocus();
}

function press(value) {
  const step = keyStep();
  const result = step.kind === 'grid' || step.kind === 'drill' ? train(history, typed, value) : choose(history, value);
  say(result.error);
  typed = result.typed || [];
  if (result.history) history = result.history;
  render();
  refocus();
}

function group(digit, mod) {
  ctrlArmed = false;
  lastPress = null;
  const result = assignGroup(history, digit, typed, mod);
  say(result.error || result.note, !result.error);
  if (result.history) history = result.history;
  typed = [];
  render();
}

// Clic sur la suggestion de groupe : crée le groupe s'il le faut, puis le sélectionne.
function pickGroup(digit, mod, create) {
  lastPress = null;
  if (create) {
    const result = assignGroup(history, digit, typed, mod);
    if (result.error) { say(result.error); render(); return; }
    history = result.history;
  }
  press(digit);
}

function outside(key) {
  say(ascii(`${key} : hors du clavier dessine.`));
  typed = [];
  render();
}

function ignore() {
  const step = keyStep();
  if (step.kind !== 'key' && step.kind !== 'select') {
    say('Etape obligatoire.');
    render();
    return;
  }
  // Au rattrapage final, plus de « plus tard » : Échap laisse le raccourci de côté.
  reset(MOMENTS[step.moment].final ? decline(history) : skip(history));
}

function back() {
  reset(typed.length ? history : history.slice(0, -1));
}

function reset(next) {
  history = next;
  typed = [];
  say('');
  ctrlArmed = false;
  lastPress = null;
  render();
  refocus();
}

// Une étape reconstruite ou une touche masquée fait perdre le focus : on le rend à l'étape.
function refocus() {
  const a = document.activeElement;
  if (a === document.body || a.closest('[hidden]') || !a.isConnected) ($('restart') || $('stage')).focus();
}

function setView(next) {
  view = next;
  document.body.dataset.view = next;
  $('v-main').setAttribute('aria-pressed', next === 'main');
  $('v-pad').setAttribute('aria-pressed', next === 'manette');
  try { localStorage.setItem('p1-view', next); } catch (e) { /* stockage indisponible : la vue n'est pas retenue */ }
}

// Survol d'une suggestion : ses touches s'entourent sur le clavier dessiné.
function peek(chip) {
  for (const b of Object.values(buttons)) b.classList.remove('peek');
  if (!chip) return;
  const v = chip.dataset.value !== 'groupe' ? partsOf(chip.dataset.value) : { mod: chip.dataset.create === '1' && chip.dataset.mod, key: chip.dataset.digit };
  for (const id of [v.mod, v.key]) if (buttons[id]) buttons[id].classList.add('peek');
}

function render() {
  const step = currentStep(history);
  const settled = settledOf(history);
  const sug = step && ['finger', 'key', 'select'].includes(step.kind) ? suggest(history) : { keys: [], combo: null };
  const seq = step && (step.kind === 'grid' || step.kind === 'drill') ? sequenceOf(settled, step) : null;
  renderStage(step, settled, sug, seq);
  const refKeys = step ? refKeysOf(sug, seq, settled) : [];
  renderKeyboard(step, settled, sug, seq, refKeys);
  renderPad(step, settled, sug, seq, refKeys);
  $('msg').className = isNote ? 'msg note' : 'msg';
  $('msg').innerHTML = message ? `${ic(isNote ? 'check' : 'warn')}<span>${esc(message)}</span>` : '';
  renderRecap(settled, !step);
  $('training').checked = trainingOf(history);
}

function renderStage(step, settled, sug, seq) {
  const ids = shortcutIds();
  const done = ids.filter((id) => settled[id]).length;
  const dots = `<span class="dots" title="${done} raccourcis sur ${ids.length}">${ids.map((id) => `<i class="${settled[id] ? 'on' : ''}"></i>`).join('')}</span>`;
  const html = step ? stepHtml(step, sug, seq, dots) : endHtml(settled, dots);
  // Ne réécrit l'étape que si elle change, pour que la zone lue par les lecteurs d'écran ne se répète pas à chaque touche.
  if (html === stageHtml) return;
  $('stage').innerHTML = stageHtml = html;
}

// Âge en cours : celui du dernier moment qui en ouvre un.
const ageOf = (moment) => `Âge ${MOMENTS.slice(0, moment + 1).filter((m) => m.age).pop()?.age || 'IV'}`;

function stepHtml(step, sug, seq, dots) {
  const m = MOMENTS[step.moment];
  const a = ACTIONS[step.action] || DRILLS[step.action];
  const [tagIcon, tagText] = step.kind === 'finger' ? ['hand', 'Avant la partie'] : step.kind === 'grid' ? ['lock', 'Grille du jeu, fixe dans cette version']
    : step.kind === 'drill' ? ['swap', 'Aller-retour'] : isExtra(history, step.action) ? ['bolt', 'Extra'] : ['crown', 'Partie optimisée'];
  const skipped = skippedAt(history, step.action);
  const sel = step.kind !== 'finger' && selectionOf(history, step, typed);
  return `<div class="top">${step.kind === 'finger' ? '' : `<span class="time">${ageOf(step.moment)} · ${m.at}</span>`}<span class="tag" title="${tagText}">${ic(tagIcon)}<span class="sr">${tagText}</span></span>
      ${skipped.length ? `<span class="again" title="Ignorée à ${skipped.join(', ')}">${ic('hourglass')}${skipped.join(', ')}</span>` : ''}
      ${sel ? `<span class="sel" title="Sélection : ${sel}">${ic(ELEMENT_ICON[sel])}<span class="sr">Sélection : ${sel}</span></span>` : ''}${dots}</div>
    <div class="act">${ic(iconOf(step.action), 'big')}<div><p class="action">${a.name}</p><p class="sit">${m.situation}</p></div></div>
    ${seq ? seqHtml(seq) : sugHtml(step, sug)}`;
}

const backHtml = () => `<button type="button" class="ghost" data-do="back" title="Revenir (Retour arrière)" aria-label="Revenir"${history.length || typed.length ? '' : ' disabled'}>${ic('undo')}<kbd>⌫</kbd></button>`;

function seqHtml(seq) {
  const steps = seq.map((k, i) => `<span class="step${i < typed.length ? ' done' : i === typed.length ? ' next' : ''}">${caps(k)}</span>`).join(ic('arrow'));
  return `<div class="seq" aria-label="${esc(seq.join(' puis '))}">${steps}</div><div class="tools">${goHtml(true)}${backHtml()}</div>`;
}

// La suggestion choisie en grande carte, avec sa logique visible et l'action qui l'inspire ; les autres en petit dessous.
function sugHtml(step, sug) {
  const c = sug.combo;
  const chosen = selectedOf(sug);
  const settled = settledOf(history);
  const options = sug.keys.map((s) => ({ value: s.key, keys: caps(s.key), stars: s.stars, meets: s.meets, why: s.why }));
  const group = c && { value: 'groupe', keys: groupCaps(c.mod, c.digit, c.create), stars: c.stars, meets: c.meets, why: c.why, group: c };
  if (group) sug.groupFirst ? options.unshift(group) : options.push(group);
  const card = (o) => {
    const main = o.value === chosen;
    const data = o.group ? `data-digit="${o.group.digit}" data-mod="${esc(o.group.mod)}" data-create="${o.group.create ? 1 : 0}"` : '';
    return `<button type="button" class="sug${main ? ' main' : ''}${o.group ? ' grp' : ''}" data-do="select" data-value="${esc(o.value)}" aria-pressed="${main}" ${data}
      aria-label="${esc(`${o.group ? `Groupe ${o.group.digit}` : o.value}. ${o.why.text}`)}"><span class="combo">${o.keys}${starsHtml(o.stars)}</span>${whyHtml(o.why, settled)}${main ? meetsHtml(o.meets) : ''}</button>`;
  };
  const final = MOMENTS[step.moment].final;
  const skip = step.kind === 'finger' || final ? '' : `<button type="button" class="ghost" data-do="skip" title="Revient au prochain moment utile (Échap)">${ic('hourglass')}Plus tard<kbd>Échap</kbd></button>`;
  const drop = step.kind === 'finger' ? '' : `<button type="button" class="ghost" data-do="decline" title="${final ? 'Aucun raccourci pour cette action' : 'Aucun raccourci maintenant ; revient en extra à la fin'}">${ic('ban')}Ne pas utiliser</button>`;
  const others = options.filter((o) => o.value !== chosen).map(card).join('');
  return `<div class="sugs">${options.filter((o) => o.value === chosen).map(card).join('')}${others ? `<div class="others">${others}</div>` : ''}</div>
    <div class="tools">${goHtml(chosen)}${skip}${drop}${backHtml()}</div>`;
}

// Ligne de logique : l'icône et les touches de l'action qui inspire la suggestion (pas pour un groupe, dont le texte donne déjà le numéro).
function whyHtml(why, settled) {
  const v = why.ref && settled[why.ref];
  return `<span class="why">${why.ref ? ic(ACTIONS[why.ref].icon) : ''}${esc(why.text)}${v && !groupDigit(v) ? ` : ${caps(v)}` : ''}</span>`;
}

// Les trois critères des étoiles de la suggestion choisie : rempli, sans objet (compté comme rempli) ou manqué.
const CRITERIA = { grille: 'Place de la grille', famille: 'Geste de la famille', doigts: 'Doigts immobiles', element: "Touche de l'élément" };
function meetsHtml(meets) {
  if (!meets) return '';
  const item = (k) => { const m = meets[k]; return `<li class="${m ? 'on' : m === null ? 'na' : 'off'}" title="${m ? 'rempli' : m === null ? 'sans objet, compte comme rempli' : 'manque'}">${ic(m === false ? 'ban' : 'star', m === false ? '' : 'star on')}${CRITERIA[k]}</li>`; };
  return `<ul class="meets">${Object.keys(CRITERIA).map(item).join('')}</ul>`;
}

// Touches de l'action qui inspire la suggestion choisie : entourées sur le clavier et la manette.
function refKeysOf(sug, seq, settled) {
  const chosen = !seq && selectedOf(sug);
  const why = chosen === 'groupe' ? sug.combo.why : chosen && sug.keys.find((k) => k.key === chosen).why;
  const v = why && why.ref && settled[why.ref];
  if (!v) return [];
  return groupDigit(v) ? [groupDigit(v)] : [partsOf(v).mod, partsOf(v).key].filter(Boolean);
}

const goHtml = (enabled) => `<button type="button" class="go" data-do="next" title="Valider et passer à la suite"${enabled ? '' : ' disabled'}>Suivant${ic('arrow')}</button>`;

// Suivant : fait la séquence d'entraînement restante, ou valide la suggestion choisie (la meilleure si aucune n'a été cliquée).
function next() {
  const step = keyStep();
  if (step.kind === 'grid' || step.kind === 'drill') {
    for (const k of sequenceOf(settledOf(history), step).slice(typed.length)) press(k);
    return;
  }
  const sug = suggest(history);
  const chosen = selectedOf(sug);
  if (chosen === 'groupe') return pickGroup(sug.combo.digit, sug.combo.mod, sug.combo.create);
  lastPress = null;
  press(chosen);
}

function endHtml(settled, dots) {
  const s = scoreOf(settled);
  return `<div class="top"><span class="time">Âge IV</span>${dots}</div>
    <div class="act">${ic('landmark', 'big')}<div><p class="action">Partie terminée</p><p class="sit">Recopie tes raccourcis dans le jeu.</p></div></div>
    <p class="score">${ic('star', 'star on')}${s.got} / ${s.max}</p>
    <div class="tools"><button class="ghost" type="button" id="restart" data-do="restart">${ic('restart')}Recommencer</button>${backHtml()}</div>`;
}

function renderKeyboard(step, settled, sug, seq, refKeys) {
  const posture = postureOf(settled);
  const uses = usesOf(settled);
  const held = heldOf(settled);
  const groups = groupsOf(history);
  const g = gestureOf(step, sug, seq);
  const c = sug.combo;
  const finger = step && step.kind === 'finger';
  for (const key of KEYS) {
    const rest = POSTURE_FINGERS.find((f) => posture[f] === key.id);
    const bound = uses[key.id] || [];
    const group = key.digit && groups[key.id];
    const other = step && step.kind === 'select' && group && group !== ACTIONS[step.action].selects;
    const conflict = step && !finger && key.zone !== 'grille' && (other || (!key.reserved && conflictOf(history, key.id)));
    const gesture = gestureClass(g, key.id);
    const combo = c && (key.id === c.digit || (c.create && key.id === c.mod));
    const armed = ctrlArmed && key.id === (groupModOf(history) || 'Ctrl');
    const reserved = finger ? (step.action === 'pouce droit' ? !key.mouse : key.mouse || key.id === 'Échap' || key.id === 'Win')
      : key.reserved && !(step && step.kind === 'select' && key.digit);
    const b = buttons[key.id];
    b.className = ['k', key.id.length > 2 && 'long', key.zone === 'grille' && 'grid', rest && 'rest', reserved && !gesture && !combo && !armed && 'res',
      conflict && !gesture && 'conflict', gesture && `sk ${gesture}`, !gesture && (combo || armed) && 'sc', refKeys.includes(key.id) && 'ref'].filter(Boolean).join(' ');
    const icons = [...bound.slice(0, 2).map((id) => ic(iconOf(id))), group ? ic('flag') + ic(ELEMENT_ICON[group]) : '', held.has(key.id) ? '<b class="held">+</b>' : ''].join('');
    b.innerHTML = `<span>${label(key.id)}</span>${icons ? `<span class="ics">${icons}</span>` : ''}${rest ? `<i class="pas">${ABBR[rest]}</i>` : ''}`;
    const tip = [rest, ...bound.map((id) => `${ACTIONS[id].short} : ${settled[id]}`), group && `Groupe ${key.id} : ${group}`, held.has(key.id) && 'Touche maintenue',
      key.zone === 'grille' && 'Grille du jeu, fixe', reserved && key.reserved].filter(Boolean).join(' · ');
    b.title = tip;
    b.setAttribute('aria-label', [key.id, tip].filter(Boolean).join(', '));
  }
}

function renderPad(step, settled, sug, seq, refKeys) {
  const posture = postureOf(settled);
  const uses = usesOf(settled);
  const held = heldOf(settled);
  const g = gestureOf(step, sug, seq);
  const rests = POSTURE_FINGERS.map((f) => posture[f]);
  // Touche hors repos du geste : le doigt qui doit bouger l'annonce d'une flèche.
  const moves = {};
  if (g && complete(posture)) for (const k of [g.mod, g.key]) if (k && !rests.includes(k)) moves[reachOf(posture, k).finger] = k;
  $('pad').innerHTML = '<div class="mouse-shape" aria-hidden="true"></div>' + POSTURE_FINGERS.map((f) => {
    const k = posture[f];
    const gesture = gestureClass(g, k);
    const cls = ['btn', step && step.action === f && 'cur', k && held.has(k) && 'mod', gesture && `sk ${gesture}`, refKeys.includes(k) && 'ref'].filter(Boolean).join(' ');
    const icons = (uses[k] || []).map((id) => ic(iconOf(id))).join('');
    const [x, y] = PAD[f];
    return `<div class="slot" style="left:${x}%;top:${y}%"><div class="${cls}" title="${f}${k ? ` : ${esc(k)}` : ''}"><small>${ABBR[f]}</small><b>${k ? label(k) : '?'}</b>${icons ? `<span class="ics">${icons}</span>` : ''}</div>`
      + `${moves[f] ? `<span class="move">${ic('arrow')}${label(moves[f])}</span>` : ''}</div>`;
  }).join('');
}

function renderRecap(settled, done) {
  const ids = shortcutIds();
  const s = scoreOf(settled);
  const keyHtml = (id) => {
    const v = settled[id];
    const declined = declinedOf(history).has(id);
    if (!v) return `<span class="todo">${done ? (declined ? `${ic('ban')}non utilisé` : 'à définir') : declined ? `${ic('ban')}à la fin`
      : skippedAt(history, id).length ? `${ic('hourglass')}plus tard` : '—'}</span>`;
    const d = groupDigit(v);
    return `${d ? groupCaps(groupModOf(history), d, true) : caps(v)}${starsHtml(starsFor(settled, id))}`;
  };
  const list = (icon, title, items) => `<section><h3>${ic(icon)}${title}</h3><ul>${items.map((id) => `<li>${ic(ACTIONS[id].icon)}<span class="nm">${ACTIONS[id].name}</span><span class="kv">${keyHtml(id)}</span></li>`).join('')}</ul></section>`;
  $('recap').innerHTML = `<h2>Tes raccourcis <span class="score">${ic('star', 'star on')}${s.got} / ${s.max}</span></h2>
    <div class="lists">${list('crown', 'Partie optimisée', ids.filter((id) => !isExtra(history, id)))}${list('bolt', 'Extras', ids.filter((id) => isExtra(history, id)))}</div>`;
}

$('stage').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-do]');
  if (!b || b.disabled) return;
  const act = b.dataset.do;
  if (act === 'select') { picked = b.dataset.value; pickedFor = history; render(); }
  else if (act === 'next') next();
  else if (act === 'skip') ignore();
  else if (act === 'decline') reset(decline(history));
  else if (act === 'back') back();
  else if (act === 'restart') reset([]);
});
$('stage').addEventListener('mouseover', (e) => peek(e.target.closest('.sug')));
$('stage').addEventListener('mouseleave', () => peek(null));
$('training').onchange = (e) => reset([...history, { type: 'mode', training: e.target.checked }]);
$('v-main').onclick = () => setView('main');
$('v-pad').onclick = () => setView('manette');
$('drawer').onclick = () => $('drawer').setAttribute('aria-expanded', $('kbscroll').classList.toggle('open'));
try { if (localStorage.getItem('p1-view') === 'manette') view = 'manette'; } catch (e) { /* stockage indisponible : vue par défaut */ }
buildKeyboard();
setView(view);
render();
</script>
